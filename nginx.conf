server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proteção temporária: enquanto o login real não existe, tudo pede usuário e
    # senha. O arquivo é gerado na subida do container por docker/10-acesso.sh.
    # Sai quando o login do Supabase entrar.
    auth_basic "Central Interna";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Buscador nenhum deve indexar a intranet.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Checagem de saúde da hospedagem: responde sem senha e não entrega nada.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html.
    # Sem isto, dar F5 em /cs ou /viagens devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reescrito a cada subida do container (docker/20-config.sh): nunca cacheia,
    # senão trocar a variável do Supabase não chegaria a quem já abriu o site.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Assets têm hash no nome, podem cachear por 1 ano.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca cacheia, senão a pessoa fica presa numa versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # add_header dentro do location apaga os de cima, então repete aqui.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
