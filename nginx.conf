server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html.
    # Sem isto, dar F5 em /cs ou /viagens devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets têm hash no nome, podem cachear por 1 ano.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca cacheia, senão a pessoa fica presa numa versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
